[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "bitemporal-robot-memory"
version = "0.1.0"
description = "Local bitemporal memory runtime for embodied agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sim = ["gymnasium[mujoco]>=1.0,<2"]

[tool.setuptools]
packages = ["robomemory"]
